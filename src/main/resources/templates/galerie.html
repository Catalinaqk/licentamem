<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Reading AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen bg-gray-50 text-gray-800 font-sans overflow-hidden">

<div class="w-64 bg-white border-r border-gray-200 flex flex-col z-20 shadow-sm">
    <div class="p-6 border-b border-gray-100 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-gray-900 cursor-pointer" onclick="schimbaEcran('galerie')">📖 Book AI</h1>
            <p class="text-xs text-gray-500 mt-1">Sesiune: <strong id="username-display">Se încarcă...</strong></p>
        </div>
        <button onclick="logout()" class="text-xs text-red-500 hover:text-red-700 font-bold">Ieșire</button>
    </div>

    <nav class="flex-1 overflow-y-auto mt-4 px-4">
        <div class="mb-6">
            <div onclick="toggleDropdown()" class="py-2 flex justify-between items-center font-bold text-sm text-gray-400 uppercase tracking-wider cursor-pointer hover:text-black transition">
                <span>Meniu Principal</span>
                <span id="dropdown-arrow">▲</span>
            </div>

            <div id="dropdown-menu" class="flex flex-col gap-1 mt-2">
                <button onclick="schimbaEcran('galerie')" id="btn-galerie" class="text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 bg-black text-white">📚 Galerie Cărți</button>
                <button onclick="schimbaEcran('trasee')" id="btn-trasee" class="text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 text-gray-600 hover:bg-gray-100">🗺️ Trasee de Lectură</button>
                <button onclick="schimbaEcran('invatare')" id="btn-invatare" class="text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 text-gray-600 hover:bg-gray-100">🎓 Modul Învățare</button>
                <button onclick="schimbaEcran('experti')" id="btn-experti" class="text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 text-gray-600 hover:bg-gray-100">🧠 Sfatul Experților</button>
                <div class="border-t border-gray-100 my-1"></div>
                <button onclick="schimbaEcran('profil')" id="btn-profil" class="text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 text-gray-600 hover:bg-gray-100">👤 Profil & Preferințe</button>
            </div>
        </div>

        <div class="mb-4">
            <div class="py-2 font-bold text-sm text-indigo-400 uppercase tracking-wider">Inteligență Artificială</div>
            <div class="flex flex-col gap-1 mt-2">
                <button onclick="schimbaEcran('chat')" id="btn-chat" class="text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 text-gray-600 hover:bg-gray-100">🤖 Agent Personalizat</button>
                <button onclick="schimbaEcran('noutati')" id="btn-noutati" class="text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 text-gray-600 hover:bg-gray-100">🔥 Noutăți Internet</button>
            </div>
        </div>
    </nav>
</div>

<div class="flex-1 flex flex-col h-screen overflow-hidden relative bg-white">

    <div id="ecran-galerie" class="flex-1 overflow-y-auto p-8 z-10 transition-opacity duration-300">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-3xl font-bold mb-6 text-gray-900">Explorează Biblioteca</h2>

            <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-8 flex items-center gap-4 shadow-sm">
                <span class="text-indigo-800 font-bold text-sm">🤖 Adaugă noutăți cu AI:</span>
                <select id="select-gen-ai" class="border border-indigo-200 rounded-lg px-3 py-2 text-sm bg-white outline-none">
                    <option>Science Fiction</option><option>Thriller</option><option>Romance</option><option>Istorie</option>
                </select>
                <button onclick="genereazaCartiDinGalerie()" id="btn-genereaza-ai" class="bg-indigo-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Generează acum</button>
            </div>

            <div class="bg-gray-50 p-6 rounded-2xl border border-gray-200 mb-6 shadow-sm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 tracking-widest">Genul cărții</label>
                        <select id="filtru-gen" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-indigo-400 transition cursor-pointer">
                            <option value="">Toate Genurile</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 tracking-widest">Autorul</label>
                        <select id="filtru-autor" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-indigo-400 transition cursor-pointer">
                            <option value="">Toți Autorii</option>
                        </select>
                    </div>
                </div>

                <div class="flex gap-3 items-center pt-2">
                    <button onclick="filtreazaCarti()" class="bg-black text-white px-10 py-3 rounded-xl font-bold hover:bg-gray-800 transition flex items-center gap-2">
                        🔍 Caută în Bibliotecă
                    </button>
                    <button onclick="reseteazaFiltre()" class="text-gray-500 text-sm font-medium hover:text-black transition px-4">
                        Resetează filtrele
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-3 mb-8 ml-2">
                <span class="text-[10px] font-bold text-gray-300 uppercase">Sugestii rapide:</span>
                <button onclick="aplicaAutorRapid('Stephen King')" class="px-3 py-1 bg-gray-100 hover:bg-indigo-100 rounded-full text-xs font-medium transition">Stephen King</button>
                <button onclick="aplicaAutorRapid('Frank Herbert')" class="px-3 py-1 bg-gray-100 hover:bg-indigo-100 rounded-full text-xs font-medium transition">Frank Herbert</button>
                <button onclick="aplicaAutorRapid('Agatha Christie')" class="px-3 py-1 bg-gray-100 hover:bg-indigo-100 rounded-full text-xs font-medium transition">Agatha Christie</button>
            </div>

            <div id="grila-carti" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 pb-20"></div>
        </div>
    </div>

    <div id="ecran-chat" class="hidden flex-col absolute inset-0 bg-white z-0 overflow-hidden">... (Chat)</div>
    <div id="ecran-noutati" class="hidden absolute inset-0 bg-gray-50 overflow-y-auto p-8 z-0">... (Noutati)</div>
    <div id="ecran-trasee" class="hidden absolute inset-0 bg-white z-0 flex flex-col p-8 overflow-hidden">... (Trasee)</div>
    <div id="ecran-invatare" class="hidden absolute inset-0 bg-white p-8 z-0 overflow-y-auto">... (Invatare)</div>
    <div id="ecran-experti" class="hidden absolute inset-0 bg-white p-8 z-0 overflow-y-auto">... (Experti)</div>
    <div id="ecran-profil" class="hidden absolute inset-0 bg-white p-8 z-0 overflow-y-auto">... (Profil)</div>

    <div id="modal-carte" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-3xl w-full max-w-4xl flex flex-col md:flex-row overflow-hidden shadow-2xl">
            <img id="modal-img" class="w-full md:w-2/5 h-[500px] object-cover bg-gray-100">
            <div class="p-10 flex-1 relative flex flex-col">
                <button onclick="inchideModal()" class="absolute top-6 right-6 text-gray-400 hover:text-black text-2xl font-bold">✕</button>
                <h2 id="modal-titlu" class="text-3xl font-bold text-gray-900 mb-2">Titlu</h2>
                <p id="modal-autor" class="text-xl text-gray-500 mb-6">Autor</p>
                <div class="overflow-y-auto max-h-48 mb-6"><p id="modal-desc" class="text-gray-700 leading-relaxed"></p></div>
                <div class="mt-auto pt-6 border-t">
                    <button id="btn-genereaza-rezumat" onclick="genereazaRezumatAI()" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold">✨ Generează Rezumat AI</button>
                    <div id="modal-ai-rezumat" class="hidden bg-indigo-50 p-4 rounded-xl text-sm italic"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let toateCartile = [];
    let currentUser = sessionStorage.getItem('currentUser') || "carla";

    window.onload = function() {
        if (!sessionStorage.getItem('currentUser')) { window.location.href = "/login"; return; }
        document.getElementById('username-display').innerText = currentUser;
        incarcaCartile();
        incarcaFiltre();
    };

    function incarcaFiltre() {
        fetch('/api/carti/filtre-unice').then(r => r.json()).then(data => {
            const sg = document.getElementById('filtru-gen');
            const sa = document.getElementById('filtru-autor');
            sg.innerHTML = '<option value="">Toate Genurile</option>';
            sa.innerHTML = '<option value="">Toți Autorii</option>';
            data.genuri.forEach(g => sg.innerHTML += `<option value="${g}">${g}</option>`);
            data.autori.forEach(a => sa.innerHTML += `<option value="${a}">${a}</option>`);
        });
    }

    function incarcaCartile() {
        fetch('/api/carti/toate').then(r => r.json()).then(d => {
            toateCartile = d;
            deseneazaCarti(d);
        });
    }

    function deseneazaCarti(lista) {
        const g = document.getElementById('grila-carti');
        g.innerHTML = "";
        lista.forEach(c => {
            g.innerHTML += `
                <div onclick="deschideModalDinLista('${c.titlu.replace(/'/g, "\\'")}')" class="bg-white border border-gray-100 rounded-2xl overflow-hidden hover:shadow-xl transition-all cursor-pointer group">
                    <div class="h-64 overflow-hidden"><img src="${c.imagine}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" onerror="this.src='https://placehold.co/300x450?text=Coperta'"></div>
                    <div class="p-4">
                        <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-tighter">${c.categorie || 'General'}</span>
                        <h3 class="font-bold text-gray-900 leading-tight truncate mt-1">${c.titlu}</h3>
                        <p class="text-xs text-gray-500 mt-1">${c.autor}</p>
                    </div>
                </div>`;
        });
    }

    function filtreazaCarti() {
        const gen = document.getElementById('filtru-gen').value.toLowerCase();
        const aut = document.getElementById('filtru-autor').value.toLowerCase();

        const filtrate = toateCartile.filter(c => {
            const mG = !gen || (c.categorie && c.categorie.toLowerCase().includes(gen));
            const mA = !aut || (c.autor && c.autor.toLowerCase().includes(aut));
            return mG && mA;
        });

        if(filtrate.length === 0) {
            document.getElementById('grila-carti').innerHTML = "<div class='col-span-4 text-center py-20 text-gray-400'>Nicio carte găsită.</div>";
        } else {
            deseneazaCarti(filtrate);
        }
    }

    function reseteazaFiltre() {
        document.getElementById('filtru-gen').value = "";
        document.getElementById('filtru-autor').value = "";
        deseneazaCarti(toateCartile);
    }

    function aplicaAutorRapid(nume) {
        document.getElementById('filtru-autor').value = nume;
        document.getElementById('filtru-gen').value = "";
        filtreazaCarti();
    }

    function deschideModalDinLista(titlu) {
        const c = toateCartile.find(x => x.titlu === titlu);
        if(!c) return;
        document.getElementById('modal-img').src = c.imagine;
        document.getElementById('modal-titlu').innerText = c.titlu;
        document.getElementById('modal-autor').innerText = c.autor;
        document.getElementById('modal-desc').innerText = c.descriere;
        document.getElementById('modal-ai-rezumat').classList.add('hidden');
        document.getElementById('btn-genereaza-rezumat').classList.remove('hidden');
        document.getElementById('modal-carte').classList.remove('hidden');
    }

    function inchideModal() { document.getElementById('modal-carte').classList.add('hidden'); }
    function toggleDropdown() { document.getElementById('dropdown-menu').classList.toggle('hidden'); }
    function logout() { sessionStorage.clear(); window.location.href = "/login"; }
    function schimbaEcran(n) { /* logica de ecrane */ }
</script>
</body>
</html>
