<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profilul Meu | Biblioteca Mea</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        h1 { font-size: 2em; color: #2d3436; margin-bottom: 5px; }
        .subtitle { color: #636e72; margin-bottom: 30px; }

        section { margin-bottom: 40px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        h3 { color: #4834d4; font-size: 1.1em; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        .chips-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .chip {
            padding: 10px 20px; background: #f0f2f5; border: 2px solid transparent;
            border-radius: 25px; cursor: pointer; transition: 0.3s; font-size: 14px; font-weight: 500;
        }
        .chip:hover { background: #e2e8f0; }
        .chip.active { background: #6c5ce7; color: white; border-color: #6c5ce7; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }

        .input-group { display: flex; gap: 10px; margin-bottom: 15px; width: 100%; }
        .input-group input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; outline: none; font-family: 'Poppins', sans-serif; }
        .btn-add { background: #00b894; color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .list-item { background: #f8f9fa; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; margin-bottom: 8px; border-left: 4px solid #00b894; }

        /* Gruparea butoanelor jos */
        .button-group { display: flex; gap: 15px; margin-top: 30px; }

        .btn-save { flex: 2; background: #2d3436; color: white; padding: 18px; border-radius: 15px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 0; }
        .btn-save:hover { background: #000; transform: translateY(-2px); }

        /* Butonul de Înapoi */
        .btn-back { flex: 1; background: #e2e8f0; color: #475569; padding: 18px; border-radius: 15px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-back:hover { background: #cbd5e1; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="container">
    <h1 id="userGreeting">Setări Profil</h1>
    <p class="subtitle">Setează parametrii pentru recomandările de Graph Matching (GraphRAG).</p>

    <section>
        <h3>🎯 Domenii de interes (Topics)</h3>
        <div class="input-group">
            <input type="text" id="customTagInput" placeholder="Ex: Psihologie, Antreprenoriat, Istorie">
            <button class="btn-add" onclick="addCustomTag()">+</button>
        </div>
        <div class="chips-container" id="intentiiContainer">
        </div>
    </section>

    <section>
        <h3>🧠 Experți și Personalități urmărite</h3>
        <p style="font-size: 13px; color: #666; margin-top: -10px;">Adaugă experți din domeniu (ex: Bill Gates, Naval Ravikant) pentru a face Multi-Hop Reasoning.</p>
        <div class="input-group">
            <input type="text" id="expertInput" placeholder="Numele expertului...">
            <button class="btn-add" onclick="addExpert()">+ Adaugă Expert</button>
        </div>
        <div id="expertsList"></div>
    </section>

    <section>
        <h3>📚 Cărți preferate / citite recent</h3>
        <div class="input-group">
            <input type="text" id="bookTitle" placeholder="Titlul cărții...">
            <input type="text" id="bookAuthor" placeholder="Autorul...">
            <button class="btn-add" onclick="addBook()">+ Adaugă Carte</button>
        </div>
        <div id="booksList"></div>
    </section>

    <div class="button-group">
        <button class="btn-back" onclick="goBack()">⬅ Înapoi</button>
        <button class="btn-save" onclick="saveAll()">💾 Salvează Profilul în Baza de Date</button>
    </div>
</div>

<script>
    let activeTags = new Set();
    let expertsFollowed = [];
    let booksRead = [];

    window.onload = () => {
        const user = sessionStorage.getItem('currentUser');
        if(!user) { window.location.href = '/login'; return; }
        document.getElementById('userGreeting').innerText = "Setări Profil: " + user;

        // CÂND SE ÎNCARCĂ PAGINA, CEREM DATELE DE LA JAVA
        fetch('/api/utilizator/profil?username=' + user)
            .then(res => res.json())
            .then(data => {
                if (data.tags) {
                    data.tags.forEach(t => addCustomTag(t)); // Refacem bulele
                }
                if (data.experts) {
                    expertsFollowed = data.experts;
                    renderExperts();
                }
                if (data.books) {
                    booksRead = data.books;
                    renderBooks();
                }
            })
            .catch(err => console.error("Eroare la încărcare profil:", err));
    };

    // TAGURI
    function addCustomTag(valToLoad) {
        const input = document.getElementById('customTagInput');
        const val = valToLoad || input.value.trim().toLowerCase();
        if(!val) return;

        activeTags.add(val);
        const container = document.getElementById('intentiiContainer');
        const newChip = document.createElement('div');
        newChip.className = 'chip active';
        newChip.innerText = val + " ✖";

        // Dacă dai click pe bulă, o șterge
        newChip.onclick = function() {
            activeTags.delete(val);
            this.remove();
        };

        container.appendChild(newChip);
        if(!valToLoad) input.value = "";
    }

    // EXPERȚI
    function addExpert() {
        const val = document.getElementById('expertInput').value.trim();
        if(!val) return;
        if(!expertsFollowed.includes(val)) {
            expertsFollowed.push(val);
            renderExperts();
        }
        document.getElementById('expertInput').value = "";
    }

    function renderExperts() {
        const container = document.getElementById('expertsList');
        container.innerHTML = expertsFollowed.map(e => `
            <div class="list-item">
                <span>🧠 <strong>${e}</strong></span>
                <span style="color: red; cursor: pointer;" onclick="removeExpert('${e}')">Șterge</span>
            </div>
        `).join('');
    }

    function removeExpert(name) {
        expertsFollowed = expertsFollowed.filter(e => e !== name);
        renderExperts();
    }

    // CĂRȚI
    function addBook() {
        const title = document.getElementById('bookTitle').value.trim();
        const author = document.getElementById('bookAuthor').value.trim();
        if(!title) return;

        booksRead.push({ title, author });
        renderBooks();
        document.getElementById('bookTitle').value = "";
        document.getElementById('bookAuthor').value = "";
    }

    function renderBooks() {
        const container = document.getElementById('booksList');
        container.innerHTML = booksRead.map((b, i) => `
            <div class="list-item">
                <span>📚 <strong>${b.title}</strong> - ${b.author}</span>
                <span style="color: red; cursor: pointer;" onclick="removeBook(${i})">Șterge</span>
            </div>
        `).join('');
    }

    function removeBook(index) {
        booksRead.splice(index, 1);
        renderBooks();
    }

    // SALVARE GENERALĂ
    function saveAll() {
        const user = sessionStorage.getItem('currentUser');
        const data = {
            username: user,
            tags: Array.from(activeTags),
            experts: expertsFollowed, // ACUM SE TRIMIT ȘI EXPERȚII!
            books: booksRead
        };

        const btn = document.querySelector('.btn-save');
        btn.innerText = "⏳ Se salvează în Graf...";

        fetch('/api/utilizator/actualizeaza-profil', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(() => {
            alert("Profilul a fost salvat și legăturile s-au făcut în Memgraph!");
            window.location.href = "/?user=" + user;
        });
    }

    // Funcția pentru butonul de Înapoi
    function goBack() {
        const user = sessionStorage.getItem('currentUser');
        if (user) {
            window.location.href = "/?user=" + user;
        } else {
            window.location.href = "/";
        }
    }
</script>

</body>
</html>
