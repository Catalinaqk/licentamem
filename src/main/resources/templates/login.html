<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Logare | Sanctuarul Intelectual</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #181c1e; }
        .card { background: white; padding: 48px 40px; border-radius: 24px; box-shadow: 0 16px 40px rgba(0,76,76,0.05); border: 1px solid #e0e3e5; width: 100%; max-width: 420px; box-sizing: border-box; }
        h1 { margin: 0 0 8px 0; font-size: 2em; font-family: 'Manrope', sans-serif; font-weight: 800; color: #004c4c; text-align: center; }
        p.subtitle { color: #64748b; margin: 0 0 32px 0; text-align: center; font-size: 0.95em; }

        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.75em; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        input { width: 100%; padding: 14px 16px; background-color: #f7fafc; border: 1px solid #e0e3e5; border-radius: 12px; font-size: 15px; box-sizing: border-box; outline: none; transition: 0.2s; font-family: 'Inter', sans-serif; color: #181c1e;}
        input:focus { border-color: #004c4c; background-color: white; box-shadow: 0 0 0 3px rgba(0,76,76,0.1); }

        button { background: #004c4c; color: white; padding: 16px; width: 100%; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; font-family: 'Inter', sans-serif; }
        button:hover { background: #003333; transform: translateY(-1px); }
        button:disabled { background: #bec9c8; cursor: not-allowed; transform: none; }

        .links-container { margin-top: 24px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
        .link { color: #004c4c; text-decoration: none; font-size: 0.9em; font-weight: 600; transition: 0.2s;}
        .link:hover { color: #002020; text-decoration: underline; }
        .link-secondary { color: #64748b; font-weight: 500; }
        .link-secondary:hover { color: #181c1e; }

        .password-container { position: relative; width: 100%; }
        .password-container input { padding-right: 70px; }
        .toggle-password { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 0.85em; font-weight: 600; color: #004c4c; user-select: none; transition: 0.2s; }
        .toggle-password:hover { color: #002020; }
    </style>
</head>
<body>

<div class="card">
    <h1>Autentificare</h1>
    <p class="subtitle">Accesează-ți sanctuarul intelectual.</p>

    <div class="input-group">
        <label>Adresa de Email</label>
        <input type="email" id="email" placeholder="nume@exemplu.ro">
    </div>

    <div class="input-group">
        <label>Parolă</label>
        <div class="password-container">
            <input type="password" id="parola" placeholder="Introdu parola">
            <span class="toggle-password" onclick="togglePassword('parola', this)">Arată</span>
        </div>
    </div>

    <button onclick="logare()" id="btnLog">Intră în cont</button>

    <div class="links-container">
        <a href="/register" class="link">Nu ai cont? Creează unul acum.</a>
        <a href="/" class="link link-secondary">Continuă ca vizitator</a>
    </div>
</div>

<script>
    function togglePassword(inputId, textElement) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            textElement.innerText = "Ascunde";
        } else {
            input.type = "password";
            textElement.innerText = "Arată";
        }
    }

    function logare() {
        const email = document.getElementById('email').value.trim();
        const parola = document.getElementById('parola').value.trim();

        if(!email || !parola) { alert("Vă rugăm să introduceți email-ul și parola."); return; }

        const btn = document.getElementById('btnLog');
        btn.innerText = "Se verifică datele..."; btn.disabled = true;

        fetch('/api/utilizator/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: email, parola: parola})
        })
            .then(res => res.json())
            .then(data => {
                // Aici am schimbat 'succes' cu 'success' (cum trimite Java)
                if(data.status === 'success') {
                    // Java trimite 'username', nu 'nume'
                    sessionStorage.setItem('currentUser', data.username);
                    window.location.href = '/?user=' + encodeURIComponent(data.username);
                } else {
                    // Aici am schimbat 'mesaj' cu 'message'
                    alert(data.message);
                    btn.innerText = "Intră în cont"; btn.disabled = false;
                }
            })
            .catch(() => {
                alert("Eroare de conexiune cu serverul.");
                btn.innerText = "Intră în cont"; btn.disabled = false;
            });
    }
</script>
</body>
</html>
